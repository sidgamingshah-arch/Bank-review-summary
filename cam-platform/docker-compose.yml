# Containerised topology (NFR-12): PostgreSQL as system-of-record (NFR-03),
# one built image running each service as its own container, all traffic
# entering through the gateway (APIM stand-in, NFR-04).
#
#   docker compose up --build
#   python scripts/seed_demo.py        # then seed masters through the gateway
#
# Dev note: services share one PostgreSQL database in this compose file (table
# ownership stays strictly per-service); production splits into per-service
# schemas/databases — see docs/adr/0004-persistence.md. The front-end runs
# `npm run dev` against http://localhost:8080 or is built and served by any
# static host.

x-service: &service
  build: .
  depends_on:
    postgres:
      condition: service_healthy
  environment: &service-env
    CAM_JWT_SECRET: ${CAM_JWT_SECRET:-dev-only-secret-do-not-use-in-production}
    CAM_LOG_LEVEL: ${CAM_LOG_LEVEL:-info}
    CAM_DB_URL: postgresql+psycopg://cam:cam@postgres:5432/cam
    CAM_GATEWAY_URL: http://gateway:8000
    CAM_DATA_DIR: /data
    CAM_LLM_PROVIDER: ${CAM_LLM_PROVIDER:-mock}
    CAM_GENAI_MODEL: ${CAM_GENAI_MODEL:-claude-opus-4-8}
    CAM_GENAI_MAX_TOKENS: ${CAM_GENAI_MAX_TOKENS:-2000}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # openai-compatible provider (CAM_LLM_PROVIDER=openai)
    CAM_GENAI_BASE_URL: ${CAM_GENAI_BASE_URL:-}
    CAM_GENAI_API_KEY_ENV: ${CAM_GENAI_API_KEY_ENV:-CAM_GENAI_API_KEY}
    CAM_GENAI_API_KEY: ${CAM_GENAI_API_KEY:-}
    CAM_GENAI_AUTH_SCHEME: ${CAM_GENAI_AUTH_SCHEME:-Bearer}
    CAM_GENAI_TEMPERATURE: ${CAM_GENAI_TEMPERATURE:-0.0}
    CAM_GENAI_TIMEOUT_SECONDS: ${CAM_GENAI_TIMEOUT_SECONDS:-120}
    # embedding egress + large-document retrieval (RAG)
    CAM_GENAI_EMBED_PROVIDER: ${CAM_GENAI_EMBED_PROVIDER:-mock}
    CAM_GENAI_EMBED_MODEL: ${CAM_GENAI_EMBED_MODEL:-}
    CAM_GENAI_EMBED_BASE_URL: ${CAM_GENAI_EMBED_BASE_URL:-}
    CAM_GENAI_EMBED_API_KEY_ENV: ${CAM_GENAI_EMBED_API_KEY_ENV:-CAM_GENAI_API_KEY}
    CAM_GENAI_EMBED_DIM: ${CAM_GENAI_EMBED_DIM:-256}
    CAM_RAG_MODE: ${CAM_RAG_MODE:-off}
    CAM_RAG_TOP_K: ${CAM_RAG_TOP_K:-6}
    CAM_RAG_CHUNK_SIZE: ${CAM_RAG_CHUNK_SIZE:-1200}
    CAM_RAG_CHUNK_OVERLAP: ${CAM_RAG_CHUNK_OVERLAP:-200}
    CAM_MAX_EXTRACT_CHARS: ${CAM_MAX_EXTRACT_CHARS:-2000000}
    CAM_RETRIEVAL_BACKEND: ${CAM_RETRIEVAL_BACKEND:-local}
    # Azure OpenAI (CAM_LLM_PROVIDER=azure / CAM_GENAI_EMBED_PROVIDER=azure)
    CAM_AZURE_OPENAI_ENDPOINT: ${CAM_AZURE_OPENAI_ENDPOINT:-}
    CAM_AZURE_OPENAI_API_VERSION: ${CAM_AZURE_OPENAI_API_VERSION:-2024-10-21}
    CAM_AZURE_OPENAI_API_KEY_ENV: ${CAM_AZURE_OPENAI_API_KEY_ENV:-AZURE_OPENAI_API_KEY}
    AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    CAM_AZURE_OPENAI_REASONING: ${CAM_AZURE_OPENAI_REASONING:-false}
    # Azure AI Search (CAM_RETRIEVAL_BACKEND=azure_search)
    CAM_AZURE_SEARCH_ENDPOINT: ${CAM_AZURE_SEARCH_ENDPOINT:-}
    CAM_AZURE_SEARCH_API_VERSION: ${CAM_AZURE_SEARCH_API_VERSION:-2024-07-01}
    CAM_AZURE_SEARCH_API_KEY_ENV: ${CAM_AZURE_SEARCH_API_KEY_ENV:-AZURE_SEARCH_API_KEY}
    AZURE_SEARCH_API_KEY: ${AZURE_SEARCH_API_KEY:-}
    CAM_AZURE_SEARCH_INDEX: ${CAM_AZURE_SEARCH_INDEX:-cam-chunks}
    # Azure Blob Storage (CAM_BLOB_BACKEND=azure)
    CAM_BLOB_BACKEND: ${CAM_BLOB_BACKEND:-local}
    CAM_AZURE_BLOB_CONNECTION_ENV: ${CAM_AZURE_BLOB_CONNECTION_ENV:-AZURE_BLOB_CONNECTION_STRING}
    AZURE_BLOB_CONNECTION_STRING: ${AZURE_BLOB_CONNECTION_STRING:-}
    CAM_AZURE_BLOB_ACCOUNT_URL: ${CAM_AZURE_BLOB_ACCOUNT_URL:-}
    CAM_AZURE_BLOB_CONTAINER_BLOBS: ${CAM_AZURE_BLOB_CONTAINER_BLOBS:-cam-blobs}
    CAM_AZURE_BLOB_CONTAINER_EXTRACTS: ${CAM_AZURE_BLOB_CONTAINER_EXTRACTS:-cam-extracts}
    # external grounding connectors (client-provided, integrated)
    CAM_CONNECTOR_NEWS_URL: ${CAM_CONNECTOR_NEWS_URL:-}
    CAM_CONNECTOR_SEARCH_URL: ${CAM_CONNECTOR_SEARCH_URL:-}
    CAM_CONNECTOR_API_KEY_ENV: ${CAM_CONNECTOR_API_KEY_ENV:-CAM_CONNECTOR_API_KEY}
    CAM_CONNECTOR_API_KEY: ${CAM_CONNECTOR_API_KEY:-}
  volumes:
    - cam-data:/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cam
      POSTGRES_PASSWORD: cam
      POSTGRES_DB: cam
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cam"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    <<: *service
    ports:
      - "8080:8000"
    environment:
      <<: *service-env
      SERVICE_MODULE: cam.gateway.main:app
      CAM_ROUTE_AUTH: http://auth:8000
      CAM_ROUTE_MASTERS: http://master-config:8000
      CAM_ROUTE_DOCUMENT: http://document:8000
      CAM_ROUTE_TAGGING: http://tagging:8000
      CAM_ROUTE_ORCHESTRATION: http://orchestration:8000
      CAM_ROUTE_GENAI: http://genai:8000
      CAM_ROUTE_OUTPUT: http://output:8000
      CAM_ROUTE_AUDIT: http://audit:8000

  auth:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_MODULE: cam.services.auth.main:app

  master-config:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_MODULE: cam.services.master_config.main:app

  document:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_MODULE: cam.services.document.main:app

  tagging:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_MODULE: cam.services.tagging.main:app

  orchestration:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_MODULE: cam.services.orchestration.main:app
      # pool spawned at startup (concurrency ceiling); live concurrency is the
      # runtime 'worker_concurrency' master setting, clamped to this.
      CAM_WORKER_POOL_SIZE: "8"
      CAM_WORKER_CONCURRENCY: "2"
      # run-level admission queue: how many runs generate at once (runtime setting);
      # per-user fairness cap so one user's burst can't take every slot
      CAM_MAX_CONCURRENT_RUNS: "4"
      CAM_MAX_ACTIVE_RUNS_PER_USER: "2"
      # completion email (SMTP). Empty host -> the mailer logs instead of sending.
      # The password is read from the env var NAMED by CAM_SMTP_PASSWORD_ENV (NFR-06).
      CAM_SMTP_HOST: ${CAM_SMTP_HOST:-}
      CAM_SMTP_PORT: ${CAM_SMTP_PORT:-587}
      CAM_SMTP_USERNAME: ${CAM_SMTP_USERNAME:-}
      CAM_SMTP_PASSWORD_ENV: ${CAM_SMTP_PASSWORD_ENV:-CAM_SMTP_PASSWORD}
      CAM_SMTP_PASSWORD: ${CAM_SMTP_PASSWORD:-}
      CAM_SMTP_FROM: ${CAM_SMTP_FROM:-CAM Studio <cam-studio@bank.example>}
      CAM_SMTP_STARTTLS: ${CAM_SMTP_STARTTLS:-true}
      CAM_SMTP_SSL: ${CAM_SMTP_SSL:-false}
      CAM_APP_BASE_URL: ${CAM_APP_BASE_URL:-http://localhost:8080}

  genai:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_MODULE: cam.services.genai.main:app

  output:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_MODULE: cam.services.output.main:app

  audit:
    <<: *service
    environment:
      <<: *service-env
      SERVICE_MODULE: cam.services.audit.main:app

volumes:
  pg-data:
  cam-data:
